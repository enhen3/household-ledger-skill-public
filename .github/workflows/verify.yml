name: Synthetic acceptance
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  acceptance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install in isolated environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r requirements.txt
          .venv/bin/python scripts/review.py doctor
          .venv/bin/python -c 'import platform; print(platform.platform()); print(platform.machine())'
          .venv/bin/python -m pip freeze
      - name: Synthetic regression and first run
        run: .venv/bin/python scripts/acceptance_receipt.py --output "$RUNNER_TEMP/household-acceptance"
      - name: Retain private exact-commit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-${{ matrix.os }}-python-${{ matrix.python }}
          path: ${{ runner.temp }}/household-acceptance/
          if-no-files-found: warn
          retention-days: 14
